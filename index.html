<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTO Campus Assistant</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#f4f6f4;padding:16px}
.app{max-width:460px;margin:auto}
h1{color:#006400}
.card{background:#fff;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 6px 16px rgba(0,0,0,.06)}
label{font-weight:600;margin-top:8px;display:block}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{width:100%;padding:12px;background:#006400;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px}
.result{margin-top:10px;background:#eef7ee;padding:12px;border-radius:10px}
small{color:#555}
</style>
</head>
<body>
<div class="app">
<h1>FUTO Campus Assistant</h1>
<p>FUTO Aggregate • CGPA • Past Questions</p>

<div class="card">
<h3>Calculate Your FUTO Aggregate</h3>
<label>JAMB Score (over 400)</label>
<input id="jamb" type="number" placeholder="e.g 280">
<label>O-Level - 5 relevant subjects</label>
<div class="grid">
<select id="g1"><option value="0">Grade 1</option><option value="90">A1</option><option value="80">B2</option><option value="70">B3</option><option value="60">C4</option><option value="55">C5</option><option value="50">C6</option></select>
<select id="g2"><option value="0">Grade 2</option><option value="90">A1</option><option value="80">B2</option><option value="70">B3</option><option value="60">C4</option><option value="55">C5</option><option value="50">C6</option></select>
<select id="g3"><option value="0">Grade 3</option><option value="90">A1</option><option value="80">B2</option><option value="70">B3</option><option value="60">C4</option><option value="55">C5</option><option value="50">C6</option></select>
<select id="g4"><option value="0">Grade 4</option><option value="90">A1</option><option value="80">B2</option><option value="70">B3</option><option value="60">C4</option><option value="55">C5</option><option value="50">C6</option></select>
<select id="g5"><option value="0">Grade 5</option><option value="90">A1</option><option value="80">B2</option><option value="70">B3</option><option value="60">C4</option><option value="55">C5</option><option value="50">C6</option></select>
</div>
<button onclick="calc()">Calculate My Aggregate</button>
<div id="res" class="result">Your result will show here</div>
</div>

</div>
<script>
function calc(){
let j = parseFloat(document.getElementById('jamb').value)||0;
let grades = [1,2,3,4,5].map(i=>parseFloat(document.getElementById('g'+i).value)||0);
if(j==0 || grades.includes(0)){ document.getElementById('res').innerHTML='Please fill JAMB and all 5 grades'; return; }
let avg = grades.reduce((a,b)=>a+b,0)/5;
// Generic FUTO formula: JAMB 70% + Olevel 30%
let aggregate = (j/400*70) + (avg/90*30);
document.getElementById('res').innerHTML = `<b style="font-size:22px;color:#006400">${aggregate.toFixed(2)}%</b><br><small>JAMB part: ${(j/400*70).toFixed(1)}% | O-Level part: ${(avg/90*30).toFixed(1)}%</small>`;
}
</script>
</body>
</html>
